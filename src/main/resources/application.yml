server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: event-gateway-api
  datasource:
    url: jdbc:h2:mem:eventgateway;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always

account-service:
  service-id: ${ACCOUNT_SERVICE_SERVICE_ID:account-service}
  default-url: ${ACCOUNT_SERVICE_DEFAULT_URL:http://localhost:8081}
  connect-timeout: ${ACCOUNT_SERVICE_CONNECT_TIMEOUT:2s}
  read-timeout: ${ACCOUNT_SERVICE_READ_TIMEOUT:5s}
  internal-caller-header: ${ACCOUNT_SERVICE_INTERNAL_CALLER_HEADER:X-Internal-Caller}
  internal-token-header: ${ACCOUNT_SERVICE_INTERNAL_TOKEN_HEADER:X-Internal-Token}
  internal-caller: ${ACCOUNT_SERVICE_INTERNAL_CALLER:event-gateway-api}
  internal-token: ${ACCOUNT_SERVICE_INTERNAL_TOKEN:local-dev-token}

event-gateway:
  retry:
    enabled: ${EVENT_GATEWAY_RETRY_ENABLED:true}
    fixed-delay: ${EVENT_GATEWAY_RETRY_FIXED_DELAY:30s}
    initial-delay: ${EVENT_GATEWAY_RETRY_INITIAL_DELAY:30s}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
    instance-id: ${spring.application.name}:${server.port}
    statusPageUrlPath: /actuator/info
    healthCheckUrlPath: /health

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,circuitbreakers,circuitbreakerevents,bulkheads
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  info:
    env:
      enabled: true

info:
  app:
    name: Event Gateway API
    description: Spring Boot skeleton for event gateway microservice capabilities.

resilience4j:
  circuitbreaker:
    instances:
      accountService:
        register-health-indicator: true
        sliding-window-type: count_based
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
  bulkhead:
    instances:
      accountService:
        max-concurrent-calls: 50
        max-wait-duration: 0

logging:
  structured:
    format:
      console: logstash
    json:
      rename:
        "[@timestamp]": timestamp
        logger_name: logger
        thread_name: thread
      customizer:
        - com.cs.eventgateway.config.logging.EventGatewayStructuredLoggingJsonCustomizer
      context:
        include: false
  level:
    root: INFO
    com.cs.eventgateway: DEBUG

