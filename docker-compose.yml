services:
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: event-gateway-zipkin
    ports:
      - "9411:9411"

  event-gateway-api:
    build:
      context: .
    container_name: event-gateway-api
    depends_on:
      - zipkin
    environment:
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_DEFAULT_ZONE: http://host.docker.internal:8761/eureka/
      ACCOUNT_SERVICE_DEFAULT_URL: http://host.docker.internal:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

